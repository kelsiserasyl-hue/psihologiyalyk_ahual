<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ортақ шаңырақ — ортақ ізденіс</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#020b1f}
body{font-family:"Palatino Linotype","Book Antiqua",Georgia,"Times New Roman",serif;color:#fff3d6}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;overflow:hidden;
background:radial-gradient(ellipse at 50% 52%,#0d3b78 0,#07224f 45%,#020b1f 85%),
repeating-linear-gradient(45deg,rgba(255,215,120,.035) 0 2px,transparent 2px 36px),repeating-linear-gradient(-45deg,rgba(255,215,120,.035) 0 2px,transparent 2px 36px);background-blend-mode:normal}
#stage:before{content:"";position:absolute;left:380px;top:620px;width:840px;height:150px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%)}
.ui{position:absolute;left:0;width:100%;text-align:center;transition:opacity 1s}
#t1{top:10px;font-size:56px;font-weight:700;letter-spacing:1px;background:linear-gradient(180deg,#fff6c9,#e8b840 55%,#9a6a14);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 6px rgba(0,0,0,.7))}
#t2{top:80px;font-size:30px;font-style:italic;color:#bff7ee;letter-spacing:3px;text-shadow:0 0 14px rgba(0,229,200,.6)}
#t2:before,#t2:after{content:"◆";color:#e8b840;margin:0 18px;font-size:18px;font-style:normal}
#cn{top:808px;font-size:28px;color:#ffe9a8}
#cnt b{color:#fff;font-size:34px}
#bar{display:flex;gap:6px;justify-content:center;margin-top:6px}
#bar i{width:24px;height:7px;border-radius:4px;background:#12335e;box-shadow:inset 0 1px 2px #000;transition:.5s}
#bar i.on{background:linear-gradient(#fff1a8,#d9a22b);box-shadow:0 0 10px #ffd978}
#in{top:858px;font-size:24px;color:#9fe9df;letter-spacing:.5px}
.done #cn,.done #in{opacity:0;pointer-events:none}
#world{position:absolute;inset:0;transform-origin:800px 470px;transition:transform 2.2s cubic-bezier(.3,.7,.2,1),opacity 2s}
#world.fin{transform:scale(1.9);opacity:.5}
#sh{position:absolute;left:580px;top:250px;width:440px;height:440px;filter:drop-shadow(0 22px 20px rgba(0,0,0,.65))}
#sh.glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 26px rgba(255,210,100,.95)) drop-shadow(0 22px 20px rgba(0,0,0,.6))}}
.med{position:absolute;width:90px;height:90px;padding:0;border:0;background:none;cursor:pointer;perspective:400px;transition:transform 1.1s cubic-bezier(.25,.8,.25,1);z-index:2}
.med.placed{z-index:3}
.fl{display:block;animation:fl 4s ease-in-out infinite}
.placed .fl{animation:none}
@keyframes fl{50%{transform:translateY(-9px)}}
.body{display:block;position:relative;width:90px;height:90px;border-radius:50%;transition:transform .35s,filter .35s;transform-style:preserve-3d;
background:radial-gradient(circle at 32% 26%,var(--a),var(--b) 78%);
box-shadow:0 0 0 4px #e3b94f,0 0 0 7px #7a5416,0 16px 24px rgba(0,0,0,.6),inset 0 -9px 15px rgba(0,0,0,.4),inset 0 7px 10px rgba(255,255,255,.55)}
.body:after{content:"";position:absolute;left:14%;top:6%;width:52%;height:28%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.75),transparent);transform:rotate(-18deg)}
.body svg{position:absolute;inset:14%;width:72%;height:72%;color:var(--o);filter:drop-shadow(0 1px 0 rgba(255,255,255,.45)) drop-shadow(0 -1px 0 rgba(0,0,0,.3))}
.med:not(.placed):hover .body,.med:not(.placed):focus-visible .body{transform:scale(1.2) rotateX(14deg) translateZ(30px);filter:brightness(1.15) drop-shadow(0 0 22px #ffd978)}
.med.placed:hover .body{filter:brightness(1.25)}
.t0{--a:#fff0b0;--b:#b8860b;--o:#5b3a00}.t1{--a:#8ff7e8;--b:#087f86;--o:#fff4c2}.t2{--a:#7cf0b0;--b:#0a6b45;--o:#fff0b8}
.t3{--a:#8fb8ff;--b:#0b3a9c;--o:#ffe08a}.t4{--a:#f0d2a6;--b:#6b4222;--o:#fff3d6}
.wave{position:absolute;left:580px;top:250px;width:440px;height:440px;border-radius:50%;border:5px solid #ffe08a;box-shadow:0 0 30px #ffd978,inset 0 0 30px #ffd978;opacity:0;pointer-events:none}
.wave.on{animation:wv 2.6s ease-out 1}
@keyframes wv{0%{transform:scale(.3);opacity:.95}100%{transform:scale(3.2);opacity:0}}
.sweep{position:absolute;left:580px;top:250px;width:440px;height:440px;border-radius:50%;opacity:0;pointer-events:none;background:conic-gradient(transparent 0 78%,rgba(255,240,170,.9) 96%,transparent);-webkit-mask:radial-gradient(circle,transparent 160px,#000 164px,#000 216px,transparent 220px);mask:radial-gradient(circle,transparent 160px,#000 164px,#000 216px,transparent 220px)}
.sweep.on{opacity:1;animation:sp 2.4s linear 3}
@keyframes sp{to{transform:rotate(360deg)}}
#ov{position:absolute;inset:0;background:rgba(2,9,26,.72);display:none;align-items:center;justify-content:center;z-index:10;perspective:1200px}
#ov.on{display:flex}
#card{position:relative;width:860px;padding:70px 80px 54px;text-align:center;border-radius:26px;animation:cd .7s cubic-bezier(.2,.9,.2,1);
background:radial-gradient(ellipse at 50% 0,#14509c,#082a5e 60%,#051a3e);border:8px solid #d9a22b;
box-shadow:0 0 0 3px #7a5416,0 0 60px rgba(255,210,100,.5),0 40px 60px rgba(0,0,0,.7),inset 0 0 40px rgba(0,0,0,.5)}
@keyframes cd{from{transform:rotateY(-80deg) scale(.6);opacity:0}}
#card:before{content:"";position:absolute;inset:14px;border:2px dashed #5ff2e0;border-radius:16px;pointer-events:none;opacity:.75}
#card svg.c{position:absolute;width:64px;height:64px;color:#ffd978;filter:drop-shadow(0 0 6px #ffd978)}
#msg{margin:0 0 34px;font-size:40px;line-height:1.35;color:#fff7dc;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.btn{font:inherit;font-size:26px;padding:14px 44px;border-radius:40px;border:3px solid #7a5416;cursor:pointer;color:#3a2400;background:linear-gradient(#fff1a8,#e0a92f 60%,#a8741a);box-shadow:0 8px 16px rgba(0,0,0,.5),inset 0 2px 3px #fff8;transition:transform .2s}
.btn:hover{transform:translateY(-3px) scale(1.04)}
#fnl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:8;opacity:0;transition:opacity 1.6s;background:radial-gradient(ellipse at 50% 50%,rgba(2,10,30,.9) 30%,transparent 70%)}
#fnl.on{display:flex}#fnl.show{opacity:1}
#fw{width:1000px;text-align:center}
#ft{margin:0 0 48px;font-size:52px;line-height:1.4;font-weight:700;background:linear-gradient(180deg,#fff9d8,#f0c24a 70%,#c58a1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 8px rgba(0,0,0,.8))}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
</style></head><body>
<div id="stage">
 <div id="world"></div>
 <div class="ui" id="t1">Google-дан табылмайтын физика</div>
 <div class="ui" id="t2">Бірлік шеңбері</div>
 <div class="ui" id="cn"><div id="cnt"></div><div id="bar"></div></div>
 <div class="ui" id="in">Бір элементті таңдаңыз. Ортақ ізденіске өз үлесіңізді қосыңыз!</div>
 <div id="ov"><div id="card"><svg class="c" style="left:14px;top:14px" viewBox="0 0 100 100"></svg><svg class="c" style="right:14px;top:14px;transform:scaleX(-1)" viewBox="0 0 100 100"></svg><svg class="c" style="left:14px;bottom:14px;transform:scaleY(-1)" viewBox="0 0 100 100"></svg><svg class="c" style="right:14px;bottom:14px;transform:scale(-1)" viewBox="0 0 100 100"></svg><p id="msg"></p><button class="btn" id="ok">Жалғастыру</button></div></div>
 <div id="fnl"><div id="fw"><p id="ft">Бір шаңырақ астында — ортақ мақсат, ортақ ізденіс, ортақ нәтиже! Ендеше, ізденісті бірге бастайық!</p><button class="btn" id="rs">Қайта бастау</button></div></div>
</div>
<canvas id="fx"></canvas>
<script>
const M=["Сіздің тәжірибеңіз — ортақ білімнің бір бөлігі.","Бүгінгі бір сұрағыңыз ертеңгі үлкен жаңалыққа бастайды.","Әр оқушының ойлануына мүмкіндік беретін ұстаз — өзгерістің бастауы.","Сіздің идеяңыз әріптесіңізге жаңа жол көрсетуі мүмкін.","Дәлел іздеу — білімге деген құрмет.","Қателік — зерттеудің соңы емес, келесі қадам.","Бірге талқыласақ, күрделі мәселенің шешімі жақындайды.","Сұрақ қоюдан қорықпаңыз: ізденіс сұрақтан басталады.","Сіздің бүгінгі тәжірибеңіз оқушының ертеңгі сенімін қалыптастырады.","Жақсы тапсырма жауапты ғана емес, ойлау жолын да ашады.","Әріптестік — тәжірибені көбейтетін күш.","Болжам жасаңыз, дерек жинаңыз, қорытындыңызды дәлелдеңіз.","Жаңа әдіс — мақсатты өзгертпей, оған апаратын жолды жаңарту.","Сіздің еңбегіңіз оқушының мүмкіндігін кеңейтеді.","Ортақ шаңырағымыз — ортақ ізденісіміздің белгісі."];
const $=s=>document.querySelector(s),st=$('#stage'),world=$('#world'),ov=$('#ov'),msg=$('#msg'),fnl=$('#fnl');
const CX=800,CY=470,RX=650,RY=280,SR=190,SC=.42;
const H='M50 76C26 76 16 52 29 39C40 29 57 37 52 49C50 55 42 54 43 49';
function orn(v){let s='<g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">';
 if(v==0)s+=`<path d="${H}"/><path d="${H}" transform="translate(100 0) scale(-1 1)"/><circle cx="50" cy="83" r="3.5" fill="currentColor"/>`;
 if(v==1){for(let k=0;k<8;k++){s+=`<ellipse cx="50" cy="27" rx="7" ry="15" transform="rotate(${k*45} 50 50)"/>`}s+='<circle cx="50" cy="50" r="6" fill="currentColor"/>'}
 if(v==2){for(let k=0;k<4;k++){s+=`<path d="M50 52C50 34 40 24 31 29C25 33 28 42 35 40" transform="rotate(${k*90} 50 50)"/>`}s+='<circle cx="50" cy="50" r="4" fill="currentColor"/>'}
 if(v==3)s+='<path d="M50 12L88 50L50 88L12 50Z"/><path d="M50 30L70 50L50 70L30 50Z"/><circle cx="50" cy="50" r="5" fill="currentColor"/><circle cx="50" cy="12" r="2.5" fill="currentColor"/><circle cx="88" cy="50" r="2.5" fill="currentColor"/><circle cx="50" cy="88" r="2.5" fill="currentColor"/><circle cx="12" cy="50" r="2.5" fill="currentColor"/>';
 return s+'</g>'}
document.querySelectorAll('svg.c').forEach(e=>e.innerHTML=orn(0));
/* шаңырақ */
let sv='<svg id="sh" viewBox="0 0 440 440"><defs><linearGradient id="w" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9a35f"/><stop offset=".5" stop-color="#7a4a1e"/><stop offset="1" stop-color="#e0b070"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".5" stop-color="#d9a22b"/><stop offset="1" stop-color="#8a5f12"/></linearGradient></defs>';
sv+='<circle cx="220" cy="220" r="190" fill="none" stroke="url(#w)" stroke-width="42"/><circle cx="220" cy="220" r="211" fill="none" stroke="url(#g)" stroke-width="4"/><circle cx="220" cy="220" r="169" fill="none" stroke="url(#g)" stroke-width="4"/><circle cx="220" cy="220" r="190" fill="none" stroke="#ffe9a8" stroke-width="2" stroke-dasharray="2 8" opacity=".5"/>';
[0,60,120].forEach(a=>sv+=`<g transform="rotate(${a} 220 220)"><rect x="52" y="212" width="336" height="16" rx="8" fill="url(#w)" stroke="#e8c25a" stroke-width="1.5"/><rect x="52" y="218.5" width="336" height="3" fill="url(#g)"/></g>`);
sv+='<circle cx="220" cy="220" r="30" fill="url(#w)" stroke="url(#g)" stroke-width="4"/><circle cx="220" cy="220" r="13" fill="url(#g)"/>';
for(let k=0;k<15;k++){const a=(-90+24*k)*Math.PI/180;sv+=`<circle cx="${220+SR*Math.cos(a)}" cy="${220+SR*Math.sin(a)}" r="22" fill="rgba(0,220,200,.14)" stroke="#5ff2e0" stroke-width="2" stroke-dasharray="4 4"/>`}
world.innerHTML=sv+'</svg><div class="sweep" id="sw"></div><div class="wave"></div><div class="wave"></div><div class="wave"></div>';
document.querySelectorAll('.wave').forEach((w,i)=>w.style.animationDelay=i*.7+'s');
/* элементтер */
const meds=[],used=Array(15).fill(0);let count=0,busy=false,cur=-1;
for(let i=0;i<15;i++){const a=(-90+24*i)*Math.PI/180,ox=CX+RX*Math.cos(a),oy=CY+RY*Math.sin(a),sx=CX+SR*Math.cos(a),sy=CY+SR*Math.sin(a);
 const b=document.createElement('button');b.className='med t'+i%5;b.style.left=ox-45+'px';b.style.top=oy-45+'px';b.dataset.dx=sx-ox;b.dataset.dy=sy-oy;b.setAttribute('aria-label','Элемент '+(i+1));
 b.innerHTML=`<span class="fl" style="animation-delay:${-i*.37}s"><span class="body"><svg viewBox="0 0 100 100">${orn(i%4)}</svg></span></span>`;
 b.onclick=()=>pick(i);world.appendChild(b);meds.push(b)}
const bar=$('#bar');bar.innerHTML='<i></i>'.repeat(15);
function upd(){$('#cnt').innerHTML=`Бірлікке қосылған үлес: <b>${count}</b> / 15`;[...bar.children].forEach((e,i)=>e.classList.toggle('on',i<count))}
function pick(i){if(busy)return;busy=true;cur=i;burst(meds[i],36,3);msg.textContent=M[i];ov.classList.remove('on');void ov.offsetWidth;ov.classList.add('on');$('#ok').focus()}
$('#ok').onclick=()=>{if(cur<0)return;const i=cur,m=meds[i];ov.classList.remove('on');m.classList.add('placed');m.style.transform=`translate(${m.dataset.dx}px,${m.dataset.dy}px) scale(${SC})`;
 const first=!used[i];if(first){used[i]=1;count++}upd();cur=-1;setTimeout(()=>{busy=false},first?1100:300);
 if(first){setTimeout(()=>burst(m,30,2.5),1000);if(count==15){busy=true;setTimeout(finale,1500)}}};
function finale(){st.classList.add('done');$('#sh').classList.add('glow');$('#sw').classList.add('on');document.querySelectorAll('.wave').forEach(w=>w.classList.add('on'));
 meds.forEach((m,k)=>setTimeout(()=>burst(m,14,2.5),k*90));
 setTimeout(()=>{world.classList.add('fin');fnl.classList.add('on');setTimeout(()=>fnl.classList.add('show'),50)},2200)}
$('#rs').onclick=()=>{used.fill(0);count=0;busy=false;cur=-1;meds.forEach(m=>{m.classList.remove('placed');m.style.transform=''});
 world.classList.remove('fin');fnl.classList.remove('show','on');st.classList.remove('done');ov.classList.remove('on');$('#sh').classList.remove('glow');$('#sw').classList.remove('on');document.querySelectorAll('.wave').forEach(w=>w.classList.remove('on'));upd()};
/* бөлшектер */
const cv=$('#fx'),cx=cv.getContext('2d');let P=[];
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);st.style.transform=`translate(-50%,-50%) scale(${s})`;cv.width=innerWidth;cv.height=innerHeight}
function burst(el,n,sp){const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*sp*2+.6;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.6,l:1,r:1+Math.random()*2.6})}}
(function tick(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0);cx.shadowBlur=10;cx.shadowColor='#ffd978';cx.fillStyle='#ffe08a';
 P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.l-=.013;cx.globalAlpha=Math.max(p.l,0);cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()});requestAnimationFrame(tick)})();
addEventListener('resize',fit);fit();upd();
</script></body></html>
